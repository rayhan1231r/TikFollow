name: Build TikFollow APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "TikFollow_Firebase_Ready.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TikFollow_Firebase_Ready.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::TikFollow_Firebase_Ready.zip was not found in the repository root. Upload it at the top level of the repository."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/settings.gradle ]; then
            echo "::error::Gradle settings file not found at the ZIP root. The ZIP must contain settings.gradle.kts and app/ directly."
            find project -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TikFollow-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
